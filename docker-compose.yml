# ============================================================
# VoxCPM Docker Compose
# ============================================================
# Usage:
#   docker compose up -d           # Start all services
#   docker compose up -d --build   # Rebuild and start
#   docker compose logs -f         # Follow logs
#   docker compose down            # Stop all
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: voxcpm-backend:latest
    restart: unless-stopped
    environment:
      VOXCPM_MODEL_ID: ${VOXCPM_MODEL_ID:-openbmb/VoxCPM2}
      HF_HOME: /models/hf
    volumes:
      - models:/models              # HuggingFace model cache (persistent)
      - runtime:/app/.runtime       # uploads + outputs
    ports:
      - "${BACKEND_PORT:-8808}:8808"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8808/api/tts/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s            # Allow time for model download on first run

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        TTS_BACKEND_URL: http://backend:8808
        NEXT_PUBLIC_TTS_API_BASE: /tts_api
    image: voxcpm-frontend:latest
    restart: unless-stopped
    environment:
      TTS_BACKEND_URL: http://backend:8808
      DATABASE_URL: file:/data/app.db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-CHANGE-ME-in-production-please}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    volumes:
      - web_db:/data                # SQLite database (persistent)
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  models:
    name: voxcpm_models
  runtime:
    name: voxcpm_runtime
  web_db:
    name: voxcpm_web_db
